<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' vjasset: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src vjmedia: blob:; connect-src vjasset: vjmedia:">
<title>VJ-Link Vorschau</title>
<style>
:root{--bg:#0C0E13;--panel:#151821;--raise:#1E222E;--line:#2A2F3D;--text:#DCE1EA;--dim:#7E879A;--accent:#FF5C93;--live:#FF3B3B;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px 14px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{width:7px;height:7px;border-radius:2px;display:inline-block}
.lab{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.grp{display:flex;align-items:center;gap:8px;min-width:0}
.seg{display:flex;gap:2px;flex-wrap:wrap}
.seg button{background:var(--raise);border:1px solid var(--line);border-radius:3px;padding:4px 9px;font:600 11px var(--mono);color:var(--dim);cursor:pointer;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.seg button .n{opacity:.6;margin-right:5px}
.seg button.off:not(.on){opacity:.55}
.spacer{margin-left:auto}
.tgl{background:var(--raise);border:1px solid var(--line);border-radius:3px;padding:4px 9px;font:600 11px var(--mono);color:var(--dim);cursor:pointer}
.tgl.on{border-color:var(--accent);color:var(--accent)}
.panes{flex:1;min-height:0;display:grid;gap:10px;padding:10px}
.panes.side{grid-template-columns:1fr 1fr}
.panes.stack{grid-template-rows:1fr 1fr}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.pane .head{display:flex;align-items:baseline;gap:10px;padding:0 2px 6px;min-width:0}
.pane .head b{font:700 11px var(--mono);letter-spacing:.08em;white-space:nowrap}
.pane .head span{color:var(--dim);font:11px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#live-pane .head b{color:var(--live)}
#pv-pane .head b{color:var(--accent)}
.box{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden}
.box canvas{display:block;background:#000}
#live-pane .box{border-color:rgba(255,59,59,.55)}
.grid{position:absolute;pointer-events:none;display:none}
.guides .grid{display:block}
.grid i{position:absolute;background:rgba(255,255,255,.28)}
.grid .safe{position:absolute;inset:5%;border:1px dashed rgba(255,255,255,.35);background:none}
.empty{position:absolute;color:var(--dim);font:12px var(--mono)}
/* Mehrere Bilder: jedes Bild live als Kachel, Klick = dieses Bild bearbeiten */
.tiles{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-content:start;overflow:auto}
.tile{position:relative;display:block;padding:0;border:2px solid var(--line);border-radius:5px;background:#000;cursor:pointer;overflow:hidden;text-align:left}
.tile canvas{display:block;width:100%;height:auto}
.tile.on{border-color:#22c8f0;box-shadow:0 0 10px rgba(34,200,240,.35)}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 5px;background:linear-gradient(transparent,rgba(0,0,0,.8));display:flex;gap:8px;align-items:baseline;min-width:0}
.tile .cap b{font:700 12px system-ui,sans-serif;color:#fff;white-space:nowrap}
.tile .cap span{font:11px var(--mono);color:#c9d0dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .cap span.none{color:var(--dim)}
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Vorschau" data-i18n-aria>
  <div class="logo"><i style="background:#FF3B3B"></i><i style="background:#FFB020"></i><i style="background:#3DDC84"></i><i style="background:#22C8F0"></i><i style="background:#B45CFF"></i>VJ-Link <span class="lab" data-i18n>Vorschau</span></div>
  <div class="grp"><span class="lab" data-i18n>Ebene</span><div class="seg" id="layers" role="radiogroup" aria-label="Ebene für die Vorschau" data-i18n-aria></div></div>
  <div class="grp spacer"><span class="lab" data-i18n>Ansicht</span><div class="seg" id="views" role="radiogroup" aria-label="Ansicht" data-i18n-aria></div></div>
  <button class="tgl" id="guides" type="button" aria-pressed="false" title="Drittel-Raster und sicherer Bereich (5 %) über beiden Bildern" data-i18n-title><span data-i18n>Raster</span></button>
  <button class="tgl" id="full" type="button" title="Vollbild an/aus (Doppelklick aufs Bild geht auch)" data-i18n-title><span data-i18n>Vollbild</span></button>
</div>
<div class="panes side" id="panes">
  <section class="pane" id="pv-pane" aria-label="Ebenen-Vorschau" data-i18n-aria><div class="head"><b id="pv-title"></b><span id="pv-info"></span></div>
    <div class="box" id="pv-box"><canvas id="pv"></canvas><div class="grid" id="pv-grid"></div><div class="empty" id="pv-empty" hidden></div></div></section>
  <section class="pane" id="live-pane" aria-label="Live-Bild" data-i18n-aria><div class="head"><b id="live-title"></b><span id="live-info"></span></div>
    <div class="box" id="live-box"><canvas id="live"></canvas><div class="grid" id="live-grid"></div></div>
    <div class="tiles" id="tiles" hidden></div></section>
</div>
<script src="monitor.js"></script>
</body>
</html>
