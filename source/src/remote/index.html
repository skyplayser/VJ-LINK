<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0E13">
<meta name="description" content="Lokale VJ-Link-Fernsteuerung für Clips, Farben, Tempo und Lichteffekte.">
<title>VJ-Link Remote</title>
<link rel="stylesheet" href="/remote.css">
<script defer src="/remote.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>VJ-Link<span class="remote-word" data-i18n>Fernsteuerung</span></div>
  <span id="status" role="status" class="status">Nicht verbunden</span>
</header>
<main>
  <section class="pair card" id="pair">
    <h1 data-i18n>Fernsteuerung koppeln</h1>
    <p data-i18n>Gib den Kopplungscode ein, den VJ-Link unter VERBINDEN → Handy-Fernsteuerung anzeigt.</p>
    <form id="pair-form">
      <label for="code" data-i18n>Kopplungscode</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="off" pattern="[0-9]{8}" minlength="8" maxlength="8" placeholder="00000000" required>
      <button class="primary" type="submit" data-i18n>Koppeln</button>
    </form>
    <p class="error" id="pair-error" role="alert"></p>
  </section>

  <div id="controls" hidden>
    <section class="card" aria-labelledby="clip-title">
      <div class="section-head"><h1 id="clip-title" data-i18n>Clips</h1><span class="subtle" id="stack"></span></div>
      <div id="layers" class="layers" aria-label="Ebenen" data-i18n-aria></div>
      <div class="clip-grid" id="clips"></div>
    </section>
    <section class="card" aria-labelledby="color-title">
      <div class="section-head"><h2 id="color-title" data-i18n>Farben</h2><button id="apply-color" class="small" type="button" data-i18n>Auf Ebene anwenden</button></div>
      <div id="slots" class="slots" aria-label="Farbslots" data-i18n-aria></div>
      <div id="presets" class="presets" aria-label="Farbvorlagen" data-i18n-aria></div>
    </section>
    <section class="card rates" aria-labelledby="strobe-title">
      <h2 id="strobe-title" data-i18n>Strobe-Regler</h2>
      <label><span data-i18n>Geschwindigkeit</span> <input id="speed" type="range" min="0" max="100" step="1"></label>
      <label><span data-i18n>Intensität</span> <input id="intensity" type="range" min="0" max="100" step="1"></label>
    </section>
  </div>
</main>
<section id="transport" class="transport" aria-label="Live-Steuerung" data-i18n-aria hidden>
  <div class="transport-inner">
    <div class="tempo">
      <div class="tempo-readout"><strong id="bpm">–</strong><span>BPM</span><small id="tempo-source"></small></div>
      <button id="tap" class="primary" type="button">TAP</button>
    </div>
    <div class="effects">
      <button data-effect="strobe" type="button">Strobe<small data-i18n>Halten</small></button>
      <button data-effect="white" type="button"><span data-i18n>Strobe White</span><small data-i18n>Halten</small></button>
      <button data-effect="blinder" type="button">Blinder<small data-i18n>Halten</small></button>
    </div>
  </div>
</section>
</body>
</html>
